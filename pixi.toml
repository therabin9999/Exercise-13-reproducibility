[workspace]
authors = ["therabin9999 <rzr0096@auburn.edu>"]
channels = ["conda-forge", "bioconda"]
name = "Exercise-13-reproducibility"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
get-data = { cmd = "mkdir -p data && curl -L -o data/sars-cov-2.fasta https://raw.githubusercontent.com/phyletica/intro-to-comp-bio/refs/heads/main/notebooks/data/SARS-CoV-2.nextclade.aligned.fasta", description = "Download the SARS-CoV-2 alignment" }
tree = { cmd = "mkdir -p results && iqtree3 -s data/sars-cov-2.fasta -m HKY -seed 1 -T 1 --prefix results/tree --redo", description = "Estimate a maximum likelihood tree with IQ-TREE" }
clock = { cmd = "python scripts/clock.py", depends-on = ["tree"], description = "Fit a molecular clock to the tree" }

[dependencies]
python = "3.14.*"
marimo = ">=0.25.1,<0.26"
numpy = ">=2.5.5,<3"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
iqtree = ">=3.1.4,<4"
